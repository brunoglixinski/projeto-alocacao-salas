<!DOCTYPE html>
<html lang="pt-BR" class="antialiased">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Alocação de Salas - UNIOESTE</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

    <script src="https://cdn.tailwindcss.com"></script>

    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: { sans: ['Inter', 'sans-serif'] },
                    boxShadow: { 'glow': '0 0 20px rgba(99, 102, 241, 0.2)' }
                }
            }
        }
    </script>

    <style>
        body {
            transition: background-color 0.3s ease, color 0.3s ease;
        }
    </style>
</head>

<body class="bg-slate-100 dark:bg-[#0a0a0a] text-slate-900 dark:text-slate-200 min-h-screen selection:bg-indigo-500/30">

    <header
        class="sticky top-0 z-50 bg-white/80 dark:bg-[#0a0a0a]/80 backdrop-blur-md border-b border-slate-300 dark:border-white/10 py-5 px-6 sm:px-8 mb-8 transition-colors shadow-sm">
        <div class="max-w-7xl mx-auto flex flex-col md:flex-row md:items-center md:justify-between gap-5">
            <div class="flex items-center gap-4">
                <div
                    class="w-8 h-8 rounded-lg bg-gradient-to-tr from-indigo-700 to-violet-600 flex items-center justify-center shadow-glow">
                    <svg class="w-4 h-4 text-white" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5"
                            d="M13 10V3L4 14h7v7l9-11h-7z" />
                    </svg>
                </div>
                <div>
                    <h1 class="text-lg font-bold tracking-tight text-slate-900 dark:text-white">Alocação UNIOESTE</h1>
                    <span
                        class="text-[11px] font-semibold tracking-widest text-indigo-700 dark:text-indigo-400 uppercase">Inteligência
                        Artificial</span>
                </div>
            </div>

            <div class="flex flex-wrap items-center gap-3">
                <button onclick="toggleTheme()"
                    class="p-2.5 rounded-full text-slate-600 hover:text-slate-900 dark:hover:text-white hover:bg-slate-200 dark:hover:bg-white/10 transition-colors"
                    title="Alternar Tema">
                    <svg id="icone-sol" class="w-5 h-5 hidden dark:block" fill="none" viewBox="0 0 24 24"
                        stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                            d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z" />
                    </svg>
                    <svg id="icone-lua" class="w-5 h-5 block dark:hidden" fill="none" viewBox="0 0 24 24"
                        stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                            d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z" />
                    </svg>
                </button>

                <div class="h-6 w-px bg-slate-300 dark:bg-white/10 mx-1 hidden sm:block"></div>

                <select id="seletor-dados"
                    class="px-3 py-2 rounded-md bg-white dark:bg-[#111] border border-slate-300 dark:border-white/20 text-sm font-semibold text-slate-700 dark:text-slate-300 outline-none focus:border-indigo-500 dark:focus:border-indigo-400 transition-colors cursor-pointer shadow-sm">
                    <option value="simples">Cenário Simples</option>
                    <option value="realista" selected>Cenário Realista</option>
                    <option value="intermediario">Cenário Intermediário</option>
                    <option value="hardcore">Cenário Hardcore</option>
                </select>


                <button onclick="buscarAlocacao('best_first')"
                    class="px-4 py-2 rounded-md text-sm font-semibold text-slate-700 dark:text-slate-300 hover:text-slate-900 dark:hover:text-white hover:bg-slate-200 dark:hover:bg-white/10 transition-all">
                    Best-First
                </button>
                <button onclick="buscarAlocacao('hill_climbing')"
                    class="px-4 py-2 rounded-md text-sm font-semibold bg-indigo-700 dark:bg-indigo-500 text-white hover:bg-indigo-800 dark:hover:bg-indigo-600 transition-all shadow-md active:scale-95">
                    Hill Climbing
                </button>
            </div>
        </div>
    </header>

    <main class="max-w-7xl mx-auto px-4 sm:px-8">

        <div id="loader" class="hidden flex-col items-center justify-center py-20 gap-4">
            <div class="relative flex h-10 w-10">
                <span
                    class="animate-ping absolute inline-flex h-full w-full rounded-full bg-indigo-500 opacity-30"></span>
                <span
                    class="relative inline-flex rounded-full h-10 w-10 bg-indigo-100 border-2 border-indigo-600 items-center justify-center">
                    <svg class="animate-spin h-5 w-5 text-indigo-700" fill="none" viewBox="0 0 24 24">
                        <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4">
                        </circle>
                        <path class="opacity-75" fill="currentColor"
                            d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z">
                        </path>
                    </svg>
                </span>
            </div>
            <p class="text-sm text-slate-600 dark:text-slate-400 font-semibold animate-pulse">Explorando espaço de
                estados...</p>
        </div>

        <div id="conteudo" class="hidden">
            <section class="grid grid-cols-2 md:grid-cols-5 gap-4 mb-10">
                <div
                    class="bg-white dark:bg-[#111] p-5 rounded-2xl border border-slate-300 dark:border-white/10 shadow-sm">
                    <p class="text-[11px] font-bold text-slate-600 dark:text-slate-400 uppercase tracking-widest mb-1">
                        Tempo Execução</p>
                    <p class="text-2xl font-semibold text-slate-900 dark:text-white flex items-baseline gap-1">
                        <span id="m-tempo">0</span> <span class="text-sm font-medium text-slate-500">ms</span>
                    </p>
                </div>
                <div
                    class="bg-white dark:bg-[#111] p-5 rounded-2xl border border-slate-300 dark:border-white/10 shadow-sm">
                    <p class="text-[11px] font-bold text-slate-600 dark:text-slate-400 uppercase tracking-widest mb-1">
                        Nós Expandidos</p>
                    <p class="text-2xl font-semibold text-slate-900 dark:text-white" id="m-nos-expandidos">0</p>
                </div>
                <div
                    class="bg-white dark:bg-[#111] p-5 rounded-2xl border border-slate-300 dark:border-white/10 shadow-sm">
                    <p class="text-[11px] font-bold text-slate-600 dark:text-slate-400 uppercase tracking-widest mb-1">
                        Nós Gerados</p>
                    <p class="text-2xl font-semibold text-slate-900 dark:text-white" id="m-nos-gerados">0</p>
                </div>
                <div
                    class="bg-white dark:bg-[#111] p-5 rounded-2xl border border-slate-300 dark:border-white/10 shadow-sm">
                    <p class="text-[11px] font-bold text-slate-600 dark:text-slate-400 uppercase tracking-widest mb-2">
                        Status da Busca</p>
                    <div class="flex items-center gap-2">
                        <div id="status-dot"
                            class="w-2.5 h-2.5 rounded-full bg-emerald-500 shadow-[0_0_8px_rgba(16,185,129,0.5)]"></div>
                        <p class="text-sm font-bold text-slate-800 dark:text-slate-200" id="m-status">Solução Encontrada
                        </p>
                    </div>
                </div>
                <div
                    class="bg-white dark:bg-[#111] p-5 rounded-2xl border border-slate-300 dark:border-white/10 shadow-sm">
                    <p class="text-[11px] font-bold text-slate-600 dark:text-slate-400 uppercase tracking-widest mb-1">
                        Conflitos</p>
                    <p class="text-2xl font-bold text-slate-900 dark:text-white" id="m-conflitos">0</p>
                </div>
            </section>

            <section class="mb-12">
                <div class="flex items-center gap-4 mb-4 px-1">

                    <h3 class="font-bold text-slate-900 dark:text-white text-lg flex items-center">
                        Matriz de Alocação
                        <span class="text-slate-500 dark:text-slate-500 font-normal mx-2">|</span>
                        <span id="algoritmo-nome"
                            class="text-indigo-700 dark:text-indigo-400 text-sm font-semibold"></span>
                    </h3>

                    <select id="seletor-sala" onchange="renderizarTabelaComFiltro()"
                        class="px-3 py-2 rounded-md bg-white dark:bg-[#111] border border-slate-300 dark:border-white/20 text-sm font-semibold text-slate-700 dark:text-slate-300 outline-none focus:border-indigo-500 dark:focus:border-indigo-400 transition-colors cursor-pointer shadow-sm hidden">
                        <option value="">Selecione uma Sala</option>
                    </select>

                </div>

                <div
                    class="bg-white dark:bg-[#111] rounded-2xl border border-slate-300 dark:border-white/10 shadow-sm overflow-hidden">
                    <div class="overflow-x-auto">
                        <table class="w-full table-fixed border-collapse">
                            <thead>
                                <tr
                                    class="bg-slate-200/50 dark:bg-[#0a0a0a]/50 border-b border-slate-300 dark:border-white/10 text-left text-xs font-bold text-slate-600 dark:text-slate-400 uppercase tracking-widest">
                                    <th class="p-4 w-28 border-r border-slate-300 dark:border-white/10 text-center">
                                        Horário</th>
                                    <th class="p-4">Segunda</th>
                                    <th class="p-4">Terça</th>
                                    <th class="p-4">Quarta</th>
                                    <th class="p-4">Quinta</th>
                                    <th class="p-4">Sexta</th>
                                </tr>
                            </thead>
                            <tbody class="divide-y divide-slate-200 dark:divide-white/10 text-sm" id="corpo-tabela">
                            </tbody>
                        </table>
                    </div>
                </div>
            </section>
        </div>
    </main>

    <script>
        function toggleTheme() {
            document.documentElement.classList.toggle('dark');
            const isDark = document.documentElement.classList.contains('dark');
            localStorage.setItem('theme', isDark ? 'dark' : 'light');
        }

        if (localStorage.theme === 'dark' || (!('theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
            document.documentElement.classList.add('dark');
        } else {
            document.documentElement.classList.remove('dark');
        }

        const diasSemana = ['Segunda', 'Terça', 'Quarta', 'Quinta', 'Sexta'];
        const horariosGrade = [
            "08:00-10:00",
            "10:00-12:00",
            "13:00-15:00",
            "15:00-17:00"
        ];

        // ALTERADO: Criação de um array global para poder filtrar as alocações no navegador
        window.gradeAlocacaoGlobal = [];

        async function buscarAlocacao(tipoAlgoritmo) {
            // Pegando o valor do cenário selecionado pelo usuário
            const cenarioSelecionado = document.getElementById('seletor-dados').value;

            document.getElementById('loader').classList.remove('hidden');
            document.getElementById('loader').classList.add('flex');
            document.getElementById('conteudo').classList.add('hidden');

            try {
                // Enviando o cenário como parâmetro na URL
                const resposta = await fetch(`/alocar/${tipoAlgoritmo}?dataset=${cenarioSelecionado}`);
                const dados = await resposta.json();

                document.getElementById('algoritmo-nome').innerText = dados.algoritmo;
                document.getElementById('m-tempo').innerText = dados.metricas.tempo_execucao_ms;
                // ALTERADO: Alimenta os novos cards tratando se a chave vier como 'nos_generados' ou 'nos_gerados'
                document.getElementById('m-nos-expandidos').innerText = dados.metricas.nos_expandidos.toLocaleString();
                document.getElementById('m-nos-gerados').innerText = dados.metricas.nos_gerados ? dados.metricas.nos_gerados.toLocaleString() : dados.metricas.nos_gerados.toLocaleString();
                document.getElementById('m-conflitos').innerText = dados.metricas.conflitos_restantes;

                const statusTexto = document.getElementById('m-status');
                const statusPonto = document.getElementById('status-dot');
                if (dados.metricas.conflitos_restantes === 0) {
                    statusTexto.innerText = "Solução Perfeita";
                    statusTexto.classList.remove('text-rose-600');
                    statusTexto.classList.add('text-slate-800');
                    statusPonto.classList.remove('bg-rose-500');
                    statusPonto.classList.add('bg-emerald-500');
                } else {
                    statusTexto.innerText = "Máximo Local";
                    statusTexto.classList.remove('text-slate-800');
                    statusTexto.classList.add('text-rose-600');
                    statusPonto.classList.remove('bg-emerald-500');
                    statusPonto.classList.add('bg-rose-500');
                }

                // ALTERADO: Salva a resposta do backend na variável global antes de montar a tabela
                window.gradeAlocacaoGlobal = dados.grade_alocacao;

                // ALTERADO: Captura o elemento do seletor e limpa antes de preencher
                const seletorSala = document.getElementById('seletor-sala');
                seletorSala.innerHTML = '';

                // ALTERADO: Popula dinamicamente com as salas recebidas do app.py
                if (dados.salas && dados.salas.length > 0) {
                    dados.salas.forEach(sala => {
                        const option = document.createElement('option');
                        option.value = sala;
                        option.innerText = sala;
                        seletorSala.appendChild(option);
                    });
                    // Torna o select visível na interface
                    seletorSala.classList.remove('hidden');
                }

                // ALTERADO: Chama o renderizador que aplica o filtro por sala
                renderizarTabelaComFiltro();

                document.getElementById('loader').classList.add('hidden');
                document.getElementById('loader').classList.remove('flex');
                document.getElementById('conteudo').classList.remove('hidden');
            } catch (erro) {
                alert('Erro ao processar dados do servidor Python.');
                console.error(erro);
            }
        }

        // ALTERADO: Função nova para renderizar a matriz de acordo com a sala selecionada
        function renderizarTabelaComFiltro() {
            const salaSelecionada = document.getElementById('seletor-sala').value;
            const tabela = document.getElementById('corpo-tabela');
            tabela.innerHTML = '';

            horariosGrade.forEach(horario => {
                let linhaHtml = `<tr class="group hover:bg-slate-100 dark:hover:bg-white/[0.02] transition-colors">
                    <td class="p-4 font-bold text-xs text-slate-600 dark:text-slate-400 bg-slate-50 dark:bg-transparent border-r border-slate-300 dark:border-white/10 text-center align-middle">${horario}</td>`;

                diasSemana.forEach(dia => {
                    // 🆕 ALTERADO: O .find() agora obrigatoriamente valida se o registro pertence à sala escolhida no topo!
                    const aula = window.gradeAlocacaoGlobal.find(g => g.dia === dia && g.horario === horario && g.sala === salaSelecionada);

                    if (aula) {
                        linhaHtml += `
                            <td class="p-2 align-top">
                                <div class="p-3.5 rounded-xl border bg-white dark:bg-[#161616] border-slate-300 dark:border-white/20 shadow-sm hover:border-indigo-400 transition-all group-hover:-translate-y-0.5">
                                    <div class="font-bold text-slate-900 dark:text-slate-200 text-sm leading-tight mb-1.5">${aula.disciplina}</div>
                                    <div class="flex items-center gap-1.5 mb-3">
                                        <div class="w-1.5 h-1.5 rounded-full bg-slate-400 dark:bg-slate-500"></div>
                                        <span class="text-xs font-medium text-slate-600 dark:text-slate-400">${aula.professor}</span>
                                    </div>
                                    <span class="inline-block text-[11px] px-2 py-1 rounded font-bold tracking-wide uppercase bg-slate-200 dark:bg-white/10 text-slate-800 dark:text-slate-300 border border-slate-300 dark:border-transparent">${aula.sala}</span>
                                </div>
                            </td>`;
                    } else {
                        linhaHtml += `<td class="p-2 align-middle text-center">
                            <div class="h-full min-h-[80px] border-2 border-dashed border-slate-300 dark:border-white/10 rounded-xl flex items-center justify-center text-xs font-bold text-slate-400 dark:text-slate-600 tracking-wider">LIVRE</div>
                        </td>`;
                    }
                });

                linhaHtml += '</tr>';
                tabela.innerHTML += linhaHtml;
            });
        }
    </script>
</body>

</html>
